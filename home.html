<!DOCTYPE html>
<html lang="en">
    <head>
                <meta charset="utf-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <link rel="stylesheet" href="home.css">
                 <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet">
        
               <title>portfolio</title>
    </head>
    <body>
        <section class="intro">
        <header class="header">
            <div class="left">
                <img src="logo.svg" width="54">
                <h1>minimal <span>shop</span>ping</h1>
            </div>

            <img src="Icon button.svg">
        </header>
            <div class="intro-banar">
                <div class="intro-img"><img src="image 2.svg" alt=""></div>
                <div class="intro-text"><div>
               <b>Get 50%  Off on Selected categories</b></div>
            </div>
            
            </div>

        </section>
        <section>
            <div class="prodacts-add">
                <p>Prodacts</p>
            </div>
        <div id="products"></div>
         <div class="button-inf"><a href="allproducts.html"><button class="bu">See More</button></a>
            </div>
        </section>

        
  <script>
 let container = document.getElementById("products");

fetch('https://dummyjson.com/products')
.then(response => response.json())
.then(data => {
    let products = data.products.slice(0,8);
console.log(data.products[0]);

products.forEach(product => {
    container.innerHTML += `
    
        <div class="product-detiels">
        <div class="product-imgandheart" >
            <span class="heart">♡</span>
            <img src="${product.thumbnail}"  class="prodect-img"></div>

          
            

            <div class="descrption">
                <a href="productdetails.html?id=${product.id}" class="title"><h3 >${product.title}</h3></a>
                <p class="price">${product.price}$</p>
                <p class="desc">${product.description.slice(0,40)}...</p>
            </div>
        </div>
    `;
});
document.querySelectorAll(".product-detiels").forEach(card => {
    const heart = card.querySelector(".heart");
    
   
    heart.addEventListener("click", () => {
        heart.classList.toggle("red"); 
        
    });
});
});
  </script>
    </body>
</html>
